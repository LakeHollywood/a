[pytest]
# Canonical namespace resolution for the Sovereign Engine suite:
#   - `pythonpath = src` registers src/sovereign_engine as THE single importable
#     namespace (no sys.path shims per conftest, no duplicate `sovereign` /
#     `sail_core` copies of core logic).
#   - repo root is prepended so `tests.*` package imports resolve identically
#     regardless of test directory depth or invocation CWD.
#   - `-p no:libtmux` disables the libtmux pytest plugin, which crashes under
#     pytest 9.1.1 at plugin-load time ("Marks cannot be applied to fixtures").
# Exclude mutmut's working directory and caches from collection; without this,
# mutants/tests/test_risk_thresholds.py collides with tests/test_risk_thresholds.py
# (same module basename) and breaks whole-repo `pytest` runs.
norecursedirs = mutants .hypothesis .pytest_cache node_modules __pycache__
# Canonical namespace resolution for the Sovereign Engine suite:
#   - repo root + `src` are registered on sys.path before collection, so
#     src/sovereign_engine is THE single importable namespace (no per-conftest
#     sys.path shims, no duplicate `sovereign` / `sail_core` copies of core
#     logic) and `tests.*` / `bench.*` imports resolve identically regardless
#     of test directory depth or invocation CWD.
pythonpath = . src
# The installed libtmux ships a pytest plugin that is incompatible with this
# pytest version ("Marks cannot be applied to fixtures") and aborts collection
# of the entire suite. Disable it so plain `pytest` works.
addopts = -p no:libtmux
